    - title: Protein Substructure Alignment via Optimal Transport
      institution: University of Cambridge & SJTU
      location: Cambridge, UK
      year: Apr 2025 – Sep 2025
      description:
        - "External collaboration | Supervisors: Prof. Pietro Liò & Prof. Liang Hong"
        - "Developed PLASMA, an optimal-transport module that adds fast, highly accurate local-substructure identification to protein representation models with minimal or no training. Accepted as a poster at <a href='https://iclr.cc/'>ICLR 2026</a>."
        - "Evaluated seven protein-language-model backbones across the VenusX motif, active-site, and binding-site tasks, improving ROC-AUC by 10–30% across all backbones and tasks."
        - "Used PyMOL case studies to show that retrieved substructures were structurally similar rather than artifacts of sequence similarity."
      linkitems:
        - linkname: Paper
          link: https://arxiv.org/abs/2510.11752
