- title: Research Experience
  type: time_table
  contents:
    - title: "Protein Substructure Alignment via Optimal Transport"
      institution: Shanghai Jiao Tong University, Shanghai, China
      year: 2025
      description:
        - "Research Assistant | Supervisors: Prof. Pietro Lio & Prof. Liang Hong"
        - "Developed PLASMA, a module based on optimal transport that can be seamlessly added to any protein representation learning model with minimal training or even no training to enable fast and highly accurate identification of locally similar substructures. Accepted at <a href='https://iclr.cc/'>ICLR 2026</a>. (<a href='https://arxiv.org/abs/2510.11752'>Paper</a>)"
        - "Completed extensive experiments on 7 backbone protein language models across 3 tasks from the VenusX dataset (motifs, active sites, and binding sites), demonstrated consistent and significant improvement (+10-30% ROC-AUC) across all backbones and tasks."
        - "Conducted case studies using PyMol visualizations and proved that the founded similar substructures are indeed similar in structure and they are not found just because of sequence similarity."
    - title: "Hierarchical Protein Representation Learning"
      institution: University of Cambridge, Cambridge, UK
      year: 2024 - 2025
      description:
        - "Research Assistant | Supervisor: Prof. Pietro Lio"
        - "Developed TCPNet, an SE(3)-equivariant topological neural network that simultaneously learns protein residue-level and secondary structure-level features without losing any geometric information. (<a href='https://talks.cam.ac.uk/talk/index/234460'>Invited Talk</a>) (<a href='https://arxiv.org/abs/2509.03885'>Paper</a>)"
        - "Awarded Highly Commended M.Phil Project Prize 2024-2025 by the Department of Computer Science and Technology."
        - "Demonstrated 5% improvement on average across 3 popular protein representation learning tasks when only structure features are provided, which can be particularly important for de novo antibody design."
    - title: "Multi-Omics Integration Data with GNNs"
      institution: University of Cambridge, Cambridge, UK
      year: 2025
      description:
        - "Research Assistant | Supervisor: Prof. Pietro Lio"
        - "Using heterogeneous graph network for embedding single cell multi-omics (e.g. RNA, protein, and ATAC modalities) data to a shared latent space and conduct cell clustering. (<a href='https://arxiv.org/abs/2510.06880'>Paper</a>)"
        - "Training time on BM-CITE and LUNG-CITE datasets takes less than an hour on a laptop GPU, with 3% lower ARI and 2% lower NMI compared to the statistical method MOJITOO."
    - title: "Graph-based Pain Estimation from Facial Expressions"
      institution: University of Cambridge, Cambridge, UK
      year: 2024 - 2025
      description:
        - "Research Assistant | Supervisor: Prof. Hatice Gunes"
        - "Presented at IJCAI25 MiGA Workshop. (<a href='https://arxiv.org/abs/2505.19802v2'>Paper</a>)"
        - "Proposed the GraphAU-Pain model that fuses a ResNet-50 backbone with graph-based facial action unit (AU) representation learning for pain intensity estimation, allowing better clinical interpretability and generalization compared to purely image-driven methods."
        - "Developed a novel transfer learning strategy to address domain differences and missing annotations, improving GraphAU-Pain's AU occurrence prediction F1-score by 30% on the UNBC dataset."
    - title: "Readmission Prediction with Remote Patient Monitoring Data"
      institution: University College London, London, UK
      year: 2023 - 2024
      description:
        - "Research Assistant | Supervisor: Prof. Ivana Drobnjak"
        - "Collaborated with clinicians from UCL Hospital to develop a SQL-based data pipeline for processing raw remote patient monitoring data, performing clinical feature engineering, and building interpretable ML models (ROC-AUC 0.79 +/- 0.03) with SHAP analysis."
        - "Designed a patient-independent stratified bootstrapping evaluation framework to address extreme data scarcity (55 patients) and class imbalance, preventing data leakage and ensuring robust generalization estimates for clinical deployment."

